name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install platform and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Android NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Test Go engine
        run: go test ./engine -v
      - name: Test encrypted backup format
        run: bash scripts/test-backup-codec.sh
      - name: Test bounded logs
        run: bash scripts/test-log-store.sh
      - name: Create Android AAR
        run: |
          mkdir -p app/libs
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" bind -target=android/arm64 -androidapi=26 -o app/libs/engine.aar ./engine
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing key
        env:
          WGF_KEYSTORE_BASE64: ${{ secrets.WGF_KEYSTORE_BASE64 }}
          WGF_KEYSTORE_PASSWORD: ${{ secrets.WGF_KEYSTORE_PASSWORD }}
          WGF_KEY_ALIAS: ${{ secrets.WGF_KEY_ALIAS }}
          WGF_KEY_PASSWORD: ${{ secrets.WGF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${WGF_KEYSTORE_BASE64:?Configure WGF_KEYSTORE_BASE64 in Actions secrets}"
          : "${WGF_KEYSTORE_PASSWORD:?Configure WGF_KEYSTORE_PASSWORD in Actions secrets}"
          : "${WGF_KEY_ALIAS:?Configure WGF_KEY_ALIAS in Actions secrets}"
          : "${WGF_KEY_PASSWORD:?Configure WGF_KEY_PASSWORD in Actions secrets}"
          mkdir -p "$RUNNER_TEMP/wgf-signing"
          printf '%s' "$WGF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wgf-signing/key.jks"
          keytool -list -keystore "$RUNNER_TEMP/wgf-signing/key.jks" -storepass "$WGF_KEYSTORE_PASSWORD" -alias "$WGF_KEY_ALIAS" >/dev/null
          echo "WGF_KEYSTORE_PATH=$RUNNER_TEMP/wgf-signing/key.jks" >> "$GITHUB_ENV"
      - name: Compile APK
        env:
          WGF_KEYSTORE_PASSWORD: ${{ secrets.WGF_KEYSTORE_PASSWORD }}
          WGF_KEY_ALIAS: ${{ secrets.WGF_KEY_ALIAS }}
          WGF_KEY_PASSWORD: ${{ secrets.WGF_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signing
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Export named APK
        run: bash scripts/export-apk.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WireGuardForwarder-APK
          path: dist/WireGuard Forwarder.apk
          if-no-files-found: error
