name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Android NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test Go engine
        run: go test ./engine -v
      - name: Create Android AAR
        run: |
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" bind -target=android/arm64 -androidapi=26 -o app/libs/engine.aar ./engine
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WireGuardForwarder-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
