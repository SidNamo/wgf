plugins {
    id 'com.android.application'
}

def stableKeystore = System.getenv('WGF_KEYSTORE_PATH')

android {
    namespace 'dev.wgforwarder.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.wgforwarder.app'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (stableKeystore) {
            persistent {
                storeFile file(stableKeystore)
                storePassword System.getenv('WGF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WGF_KEY_ALIAS')
                keyPassword System.getenv('WGF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (stableKeystore) {
                signingConfig signingConfigs.persistent
            }
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation files('libs/engine.aar')
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
